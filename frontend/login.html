<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeScan — Sign In</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--acc:#6366f1;--acc2:#8b5cf6;--bg:#f8fafc;--surface:#fff;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);--text:#0f172a;--text2:#475569;--text3:#94a3b8;--bg3:#f1f5f9;--danger:#ef4444;--danger-bg:#fef2f2}
    [data-theme=dark]{--bg:#0a0f1e;--bg3:#1e293b;--surface:#111827;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f1f5f9;--text2:#94a3b8;--text3:#475569;--danger-bg:#1f0808}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;transition:background 0.3s,color 0.3s}
    .bg-circles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
    .circle{position:absolute;border-radius:50%;opacity:0.06}
    .c1{width:400px;height:400px;background:var(--acc);top:-100px;right:-100px}
    .c2{width:300px;height:300px;background:var(--acc2);bottom:-80px;left:-80px}
    .box{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px 28px;width:100%;max-width:400px;position:relative;z-index:1;box-shadow:0 20px 60px rgba(0,0,0,0.1)}
    [data-theme=dark] .box{box-shadow:0 20px 60px rgba(0,0,0,0.5)}
    .logo{text-align:center;margin-bottom:32px}
    .logo-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;box-shadow:0 8px 24px rgba(99,102,241,0.3)}
    .logo h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .logo p{color:var(--text2);font-size:14px;margin-top:4px}
    .label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase}
    .input{width:100%;padding:13px 16px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:12px;font-size:15px;font-family:inherit;color:var(--text);transition:all 0.15s;margin-bottom:16px}
    .input:focus{outline:none;border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 3px rgba(99,102,241,0.12)}
    .btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(99,102,241,0.35);transition:all 0.18s;letter-spacing:-0.01em}
    .btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,0.45)}
    .btn:active{transform:translateY(0)}
    .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
    .err{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
    .footer{text-align:center;margin-top:20px;font-size:14px;color:var(--text2)}
    .footer a{color:var(--acc);font-weight:600}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:12px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border2)}
    .theme-btn{position:absolute;top:16px;right:16px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text2);transition:all 0.15s}
    .theme-btn:hover{background:var(--border);color:var(--acc)}
  </style>
</head>
<body>
<div class="bg-circles"><div class="circle c1"></div><div class="circle c2"></div></div>

<div class="box">
  <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>

  <div class="logo">
    <div class="logo-icon">🔍</div>
    <h1>SafeScan</h1>
    <p>Know what's in your food</p>
  </div>

  <div class="err" id="err"></div>

  <label class="label">Email Address</label>
  <input class="input" type="email" id="email" placeholder="you@example.com" autocomplete="email">

  <label class="label">Password</label>
  <input class="input" type="password" id="password" placeholder="Enter your password" style="margin-bottom:20px" autocomplete="current-password">

  <button class="btn" id="loginBtn" onclick="doLogin()">Sign In →</button>

  <div class="divider">or</div>

  <div class="footer">Don't have an account? <a href="register.html">Create one free</a></div>
</div>

<script>
  const API='http://127.0.0.1:8000/api';
  const th=localStorage.getItem('ss_theme');
  if(th==='dark')document.documentElement.setAttribute('data-theme','dark');
  if(localStorage.getItem('ss_token'))window.location.href='dashboard.html';

  function toggleTheme(){
    const d=document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme',d?'':'dark');
    localStorage.setItem('ss_theme',d?'light':'dark');
  }

  async function doLogin(){
    const email=document.getElementById('email').value.trim();
    const pass=document.getElementById('password').value;
    const err=document.getElementById('err');
    const btn=document.getElementById('loginBtn');
    err.style.display='none';
    if(!email||!pass){err.textContent='Please fill in all fields.';err.style.display='block';return;}
    btn.disabled=true;btn.textContent='Signing in…';
    try{
      const res=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
      const data=await res.json();
      if(!res.ok)throw new Error(data.detail||'Login failed');
      localStorage.setItem('ss_token',data.access_token);
      localStorage.setItem('ss_user',JSON.stringify({id:data.user_id,name:data.name}));
      window.location.href='dashboard.html';
    }catch(e){err.textContent=e.message;err.style.display='block';}
    finally{btn.disabled=false;btn.textContent='Sign In →';}
  }
  document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
