<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeScan — Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <span class="nav-logo">🔍 SafeScan</span>
    <div class="nav-actions">
      <button class="nav-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
      <a href="profile.html" class="nav-btn" title="Profile">👤</a>
    </div>
  </div>
</nav>

<div class="container" style="padding-top:20px">

  <!-- Hero Welcome Card -->
  <div class="hero-card">
    <h2>Hello, <span id="userName">there</span> 👋</h2>
    <p>Ready to scan something today?</p>
    <a href="scan.html" style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.2);color:white;border:1.5px solid rgba(255,255,255,0.4);border-radius:12px;padding:11px 20px;font-size:15px;font-weight:700;text-decoration:none;margin-top:16px;transition:background 0.15s" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">
      📷 Scan a Product
    </a>
  </div>

  <!-- Stats -->
  <div class="card" style="padding:18px">
    <div class="section-title">📊 Your Stats</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statTotal" style="color:var(--accent)">—</div>
        <div class="stat-lbl">Total</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statSafe" style="color:var(--safe)">—</div>
        <div class="stat-lbl">Safe</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statUnsafe" style="color:var(--danger)">—</div>
        <div class="stat-lbl">Unsafe</div>
      </div>
    </div>
  </div>

  <!-- Allergens caught -->
  <div class="card" id="allergenCard" style="display:none">
    <div class="section-title">🛡️ Allergens Caught This Month</div>
    <div id="allergenList" class="chip-group"></div>
  </div>

  <!-- Recent scans -->
  <div class="section-title" style="margin-top:4px">🕐 Recent Scans</div>
  <div id="recentScans">
    <div class="card" style="text-align:center;padding:30px">
      <div class="spin" style="margin:0 auto 12px"></div>
      <p class="text-sm text-muted">Loading your scans…</p>
    </div>
  </div>

</div>

<nav class="tab-bar">
  <a href="dashboard.html" class="tab-item active"><span class="tab-icon">🏠</span>Home</a>
  <a href="scan.html"      class="tab-item"><span class="tab-icon">📷</span>Scan</a>
  <a href="history.html"   class="tab-item"><span class="tab-icon">🕐</span>History</a>
  <a href="profile.html"   class="tab-item"><span class="tab-icon">👤</span>Profile</a>
</nav>

<script>
  const API='http://127.0.0.1:8000/api';
  const token=localStorage.getItem('ss_token');
  if(!token)window.location.href='login.html';

  // Theme
  const saved=localStorage.getItem('ss_theme');
  if(saved==='dark')document.documentElement.setAttribute('data-theme','dark');
  function toggleTheme(){
    const d=document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme',d?'':'dark');
    localStorage.setItem('ss_theme',d?'light':'dark');
    document.getElementById('themeBtn').textContent=d?'🌙':'☀️';
  }
  if(saved==='dark')document.getElementById('themeBtn').textContent='☀️';

  const user=JSON.parse(localStorage.getItem('ss_user')||'{}');
  if(user.name)document.getElementById('userName').textContent=user.name.split(' ')[0];

  function vIcon(v){return v==='safe'?'✅':v==='caution'?'⚠️':'❌';}
  function vLabel(v){return v==='safe'?'Safe':v==='caution'?'Caution':'Unsafe';}

  async function load(){
    try{
      const res=await fetch(`${API}/dashboard/stats`,{headers:{'Authorization':`Bearer ${token}`}});
      if(!res.ok)throw new Error();
      const d=await res.json();
      document.getElementById('statTotal').textContent=d.total_scans;
      document.getElementById('statSafe').textContent=d.safe;
      document.getElementById('statUnsafe').textContent=d.unsafe;

      if(d.allergens_avoided&&d.allergens_avoided.length){
        document.getElementById('allergenCard').style.display='';
        document.getElementById('allergenList').innerHTML=d.allergens_avoided
          .map(a=>`<span class="chip on" style="cursor:default">${a.name} ×${a.count}</span>`).join('');
      }

      const el=document.getElementById('recentScans');
      if(!d.recent_scans||!d.recent_scans.length){
        el.innerHTML=`<div class="card" style="text-align:center;padding:40px">
          <div style="font-size:48px;margin-bottom:12px">📷</div>
          <p style="font-weight:600;margin-bottom:6px">No scans yet</p>
          <p class="text-sm text-muted">Tap "Scan a Product" to get started!</p>
        </div>`;
        return;
      }
      el.innerHTML=d.recent_scans.map(s=>`
        <a href="results.html?id=${s.id}" class="scan-row">
          <div class="scan-thumb">${vIcon(s.verdict)}</div>
          <div style="flex:1">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
              <span class="badge badge-${s.verdict}">${vLabel(s.verdict)}</span>
              <span class="text-xs text-muted">Score: <strong>${s.health_score}</strong></span>
            </div>
            <div class="text-xs text-muted">${new Date(s.scanned_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div>
          </div>
          <span style="color:var(--text3);font-size:16px">›</span>
        </a>`).join('');
    }catch{
      document.getElementById('recentScans').innerHTML=`<div class="card" style="text-align:center;padding:30px;color:var(--danger)">⚠️ Could not load data. Is backend running?</div>`;
    }
  }
  load();
</script>
</body>
</html>
